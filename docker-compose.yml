services:
  bot:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # 默认数据库是 SQLite 文件，挂载出来保证容器重建后数据仍在
      - ./data:/app/data
    networks:
      - qq-group-ops

  # 可选：使用 PostgreSQL 时启动。需要 .env 里 DATABASE_URL 指向 db 服务：
  #   DATABASE_URL=postgres://qqbot:change-me@db:5432/qq_group_ops
  # 启动命令：pnpm db:up（即 docker compose --profile postgres up -d db）
  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qq_group_ops}
      POSTGRES_USER: ${POSTGRES_USER:-qqbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 仅本机开发使用；生产请删除该映射，让 bot 通过 compose 网络访问 db
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-qqbot} -d $${POSTGRES_DB:-qq_group_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - qq-group-ops

volumes:
  pgdata:

networks:
  qq-group-ops:
    driver: bridge
