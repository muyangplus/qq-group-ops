version: 2
# 依赖与工作流的安全更新：每周给 npm 依赖与 GitHub Actions 各开一个分组 PR。
# 这些 PR 会走 CI（typecheck + 全量测试），合并前人工 review —— 对应 TODO 的 D6。
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
      production-dependencies:
        dependency-type: production
        patterns: ["*"]
    # @types/node 必须与**运行时 Node 大版本**一致（engines.node / CI matrix 都是 24），
    # 否则类型检查会允许调用运行时并不存在的 API：类型过了、线上炸。major 一律不看。
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
