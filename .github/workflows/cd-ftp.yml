name: CD · FTP 发布

# 触发方式：在 GitHub 上把 tag 发布成 Release（release: published），或手动触发。
# 上传内容是**运行产物**：`dist/` + `web/dist/` + `scripts/` + `pnpm-lock.yaml` + `.env.example`
# （不含 src / docs / tsconfig / Dockerfile / test / data / logs / *.map）。
#
# **部署门禁默认复用 CI**（ADR-0067）：同一个 commit 的 `ci.yml` 已经绿了就不再重复跑
# typecheck / 全量 vitest / 前端组件测试（内容是同一份，再跑一遍只是等 2–3 分钟），
# 只装依赖 + 构建（含前端）+ 自证；查不到绿的 CI run 时**回落到全套门禁**（fail-safe），
# `workflow_dispatch` 传 `full_gate=true` 可强制全套。
#
# **两个文件、两段上传**（ADR-0065；结构沿用 ADR-0057 的「标记最后落地」）：
#   ① `incoming/deploy-<版本>.tgz` —— 一个包，里面就是上面那份运行产物 + `dist/build-info.json`；
#   ② `incoming/deploy-<版本>.json` —— 版本 / commit / **sha256** / **dist 指纹** / 构建时间。
# 机器人侧 `DeployInstaller` 扫到 **②** 才开始干活（①还没传完时它看不到标记）：
# 先按 sha256 校验包（防半传），再解包、用 `distFingerprint()` 与包内 `build-info.json`
# 自证，最后整目录替换 `dist/` `web/dist/` `scripts/`。
#
# **为什么不再需要同步状态**：老方案是 FTP 逐文件同步，必须靠 `ftp-sync-state-*.json`
# 记住「上次传过什么」才能只传差异 —— 而它的代价是「服务器上的文件被别的路径改过（回滚 /
# 机器人自解包）时，下一轮上传会被静默跳过」，真机因此出现过「版本号是新的、代码是旧的」。
# 现在每轮只传 2 个文件（体积小、耗时不再由文件数决定），**每次都是全量**，
# 所以不存在「同步状态与服务器实况不一致」这种失败模式；机器人自己动过 `dist/` 之后
# 还会主动删掉旧的 `ftp-sync-state-*.json`，那份状态对它来说已经无意义（保留只为兼容）。
#
# 注意：只推 tag 但不创建 Release **不会**触发本工作流；要改成 tag 推送即部署，
# 把 `release:` 换成 `push: { tags: ["v*"] }`（两者都开会导致同一次发布跑两遍）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的 tag / commit（留空 = 当前分支）
        required: false
        default: ""
      dry_run:
        description: 只试连与比对差异、不上传（验证 FTP 被动端口是否放行）
        type: boolean
        required: false
        default: false
      mode:
        description: "package = 单文件产物包（默认）；files = 逐文件上传（应急；服务器还是没安装器的老版本时也走它做首跳）"
        type: choice
        required: false
        default: package
        options:
          - package
          - files
      full_gate:
        description: 强制重跑全套部署门禁（默认 false = 同一 commit 的 CI 已绿时复用 CI 结论）
        type: boolean
        required: false
        default: false

# 最小权限：部署只用 FTP 凭据（secrets）；`actions: read` 只为查「同一 commit 的 CI 结论」
# （复用 CI，见 ADR-0067），不需要任何写权限。
permissions:
  contents: read
  actions: read

# 同一 ref 同时只允许一次部署，避免并发写坏服务器目录（排队而非取消）。
concurrency:
  group: cd-ftp-${{ github.ref }}
  cancel-in-progress: false

env:
  # 部署来源：优先 Release 的 tag，其次手动输入的 ref，最后当前 ref。
  DEPLOY_REF: ${{ github.event.release.tag_name || inputs.ref || github.ref_name }}
  # 部署模式：`package`（默认，ADR-0065）/ `files`（老口径应急开关）。
  # Release 触发时没有 inputs，`||` 兜到 package。
  DEPLOY_MODE: ${{ inputs.mode || 'package' }}

jobs:
  # 部署前门禁：默认「复用 CI」（同一 commit 的 ci.yml 已绿 → 只装依赖 + 构建），
  # 查不到绿的 CI run（或 `full_gate=true`）时跑全套：typecheck + 全量测试 + 前端测试 + 构建。
  # 任何一步失败都不会碰服务器。
  build:
    name: 构建与测试（部署门禁）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: pnpm

      # 查 CI 结论要用**实际检出的 commit**：`workflow_dispatch` 可以指定 `ref`（补发 / 回滚旧
      # tag），那与 `GITHUB_SHA`（工作流所在 ref 的 commit）不是同一个 commit。
      - name: 记下实际部署的 commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 查同一 commit 的 CI 是否已绿（决定是否复用 CI 结论）
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
          FORCE_FULL_GATE: ${{ inputs.full_gate }}
        run: |
          set -eu
          green="false"
          if [ "$FORCE_FULL_GATE" = "true" ]; then
            echo "full_gate=true：手动强制全套门禁"
          elif answer="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=1" --jq '.total_count' 2>&1)"; then
            if [ "$answer" = "1" ]; then
              green="true"
            fi
          else
            # 查不到（权限 / 网络 / API 变动）就当没有：宁可多跑一遍门禁，不可少跑
            echo "::warning::查询 CI 结论失败，回落到全套门禁：$answer"
          fi
          echo "green=${green}" >> "$GITHUB_OUTPUT"
          {
            echo "### 部署门禁"
            echo ""
            if [ "$green" = "true" ]; then
              echo "- 复用 \`ci.yml\` 的结论（commit \`${SHA}\` 已绿）：只装依赖 + 构建 + 自证"
            else
              echo "- **跑全套门禁**（同一 commit 没有绿的 CI run，或手动强制）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 以下三步在「复用 CI」时跳过 —— 同一 commit 上 ci.yml 已经跑过同样的内容（ADR-0067）
      - name: Typecheck
        if: steps.ci.outputs.green != 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.ci.outputs.green != 'true'
        run: pnpm test

      - name: Build
        run: pnpm build

      # 管理前台（web/）是**独立的一套依赖**，根 pnpm install 不装它；
      # 构建出来一起发上去，服务器上就不需要再手工 build / 拷贝 web/dist 了。
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      # 组件测试也在门禁里：前端逻辑错误不该靠「发完再看」发现（根 `pnpm test` 只跑契约守卫）
      - name: Test web
        if: steps.ci.outputs.green != 'true'
        run: pnpm web:test

      - name: Build web（类型检查 + vite build）
        run: pnpm web:build

      # 不传源码时 sourcemap 没有可对照的源文件：**构建阶段就删掉**。
      # 必须在生成 `build-info.json` 之前删 —— 否则指纹是按「带 map」的 dist 算的，
      # 而传上去的包是「不带 map」的，机器人自证会永远对不上（ADR-0065）。
      - name: 删除 sourcemap（产物不含 src，留着没有对照）
        run: find dist web/dist -name '*.map' -type f -delete

      # 构建自证（ADR-0065）：把版本 / commit / dist 指纹钉进产物，机器人侧解包后据此自证。
      # 关键：`distFingerprint()` **跳过 build-info.json 自己**，所以先写文件、指纹里不含它。
      - name: 生成 dist/build-info.json（构建自证）
        run: |
          set -eu
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const { createHash } = require("node:crypto");
            const { readdirSync } = require("node:fs");
            const { join } = require("node:path");
            const list = (dir, prefix = "") =>
              readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
                const name = prefix.length > 0 ? `${prefix}/${entry.name}` : entry.name;
                return entry.isDirectory() ? list(join(dir, entry.name), name) : [name];
              });
            const files = list("dist").filter((f) => f !== "build-info.json").sort();
            const hash = createHash("sha1");
            for (const file of files) {
              hash.update(file);
              hash.update("\0");
              hash.update(createHash("sha1").update(readFileSync(join("dist", file))).digest("hex"));
              hash.update("\n");
            }
            const info = {
              version: JSON.parse(readFileSync("package.json", "utf8")).version,
              commit: process.env.GITHUB_SHA || "",
              builtAt: new Date().toISOString(),
              distFingerprint: hash.digest("hex"),
            };
            writeFileSync("dist/build-info.json", `${JSON.stringify(info, null, 2)}\n`);
            console.log("build-info.json:", JSON.stringify(info));
          '

      - name: 记录部署来源（审计线索）
        run: |
          {
            echo "### 部署来源"
            echo ""
            echo "- ref: \`${DEPLOY_REF}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- 触发: ${GITHUB_EVENT_NAME}"
            echo "- 执行者: ${GITHUB_ACTOR}"
            echo "- 模式: \`${DEPLOY_MODE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            web/dist/
          retention-days: 7

  # 真正写服务器的任务：放在 Environment 里，可在仓库 Settings → Environments
  # 给 production-ftp 配 required reviewers / 等待时间，实现「人工放行后才部署」。
  deploy:
    name: 上传到 FTP
    needs: build
    runs-on: ubuntu-latest
    environment: production-ftp
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}
          persist-credentials: false

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: .

      # 打包（`mode=package`）：一个 `.tgz` + 一个投递标记 `.json`。
      # 包内容是**运行产物白名单**：dist（`node dist/main.js` 自包含，含 build-info.json）
      # + web/dist（管理前台静态资源）+ scripts（class:index，纯 node 内置模块）+ 依赖清单。
      # 不传 src / docs / tsconfig / Dockerfile / test —— 生产机器不需要它们。
      - name: 组装产物包（单文件产物包模式）
        if: env.DEPLOY_MODE != 'files'
        run: |
          set -eu
          rm -rf deploy-pkg
          mkdir -p deploy-pkg/incoming
          version="$(node -p "require('./package.json').version")"
          test -f dist/build-info.json
          tar --create --gzip --file "deploy-pkg/incoming/deploy-${version}.tgz" \
            --exclude='*.map' \
            dist web/dist scripts pnpm-lock.yaml .env.example
          sha256="$(sha256sum "deploy-pkg/incoming/deploy-${version}.tgz" | awk '{print $1}')"
          fingerprint="$(node -p "require('./dist/build-info.json').distFingerprint")"
          committed="$(node -p "require('./dist/build-info.json').commit")"
          built="$(node -p "require('./dist/build-info.json').builtAt")"
          cat > "deploy-pkg/incoming/deploy-${version}.json" <<JSON
          {
            "version": "${version}",
            "commit": "${committed}",
            "sha256": "${sha256}",
            "distFingerprint": "${fingerprint}",
            "builtAt": "${built}"
          }
          JSON
          echo "产物包："
          ls -l deploy-pkg/incoming
          echo "sha256=${sha256}"
          echo "distFingerprint=${fingerprint}"

      # 打包（`mode=files`，应急）：退回 ADR-0057 的逐文件两段上传 —— 代码与清单先传，
      # `package.json`（部署监测认的版本标记）最后单独传。两处用法：① 包化路径出问题时的应急；② **首跳** —— 服务器上还是 0.27.x（没有 `DeployInstaller`）时，包模式的产物它解不开，只能先用它把新代码送上去（见 OPERATIONS.md「首跳」）。
      - name: 准备部署目录（逐文件模式，应急）
        if: env.DEPLOY_MODE == 'files'
        run: |
          set -eu
          rm -rf dist-deploy dist-marker
          mkdir -p dist-deploy dist-marker
          for item in dist web/dist scripts pnpm-lock.yaml .env.example; do
            if [ -e "$item" ]; then
              mkdir -p "dist-deploy/$(dirname "$item")"
              cp -R "$item" "dist-deploy/$(dirname "$item")/"
            fi
          done
          find dist-deploy -name '*.map' -type f -delete
          cp package.json dist-marker/package.json
          echo "第一批（代码与清单）："
          find dist-deploy -maxdepth 1 -mindepth 1 -printf '%f\n' | sort
          du -sh dist-deploy
          echo "第二批（版本标记，最后落地）："
          find dist-marker -maxdepth 1 -mindepth 1 -printf '%f\n' | sort

      # 先校验配置齐全，避免半途失败留下半份文件；只打印非敏感信息。
      - name: 校验 FTP 配置
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          [ -z "$FTP_SERVER_DIR" ] && missing="$missing FTP_SERVER_DIR(variable)"
          if [ -n "$missing" ]; then
            echo "::error::缺少配置：$missing（见 docs/CD.md）"
            exit 1
          fi
          echo "目标：$FTP_SERVER  目录：$FTP_SERVER_DIR（凭据不回显）"
          echo "模式：$DEPLOY_MODE"

      # 第一段：**包先落地**（`mode=package`）。
      - name: 上传产物包 incoming/deploy-*.tgz（第一段）
        if: env.DEPLOY_MODE != 'files'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # 默认 FTPS（显式 TLS）；服务器只支持明文 FTP 时才把变量改成 ftp（不推荐）
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./deploy-pkg/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          # 两段各用**不同**的 state-name：这个 Action 的删除动作来自它「上次传过什么」
          # 的同步状态，共用一份会互相把对方的文件判成「本地没有 → 从服务器删掉」
          # （ADR-0057 的事故：v0.24.0 发布就这么删掉过服务器的 dist/ scripts/ web/）。
          state-name: ftp-sync-state-package.json
          # 只试连：dry-run 会走完 PASV 数据连接与差异比对，但不写服务器文件
          dry-run: ${{ inputs.dry_run }}
          # 被动模式数据连接建立慢时多等一会儿（默认 30s 偏紧）
          timeout: 120000
          log-level: standard
          # 显式写死：绝不删除状态文件之外的东西（默认即 false）
          dangerous-clean-slate: false
          # 第二层保险：即使组包时漏了，也不上传这些
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/data/**
            **/logs/**
            **/coverage/**
            **/.env
            **/.env.*
            **/*.log
            **/test/**
            **/*.map

      # 第二段：**投递标记最后落地**（ADR-0065 与 ADR-0057 同构）。
      # 在它落地之前，机器人看不到 `deploy-<版本>.json` → `DeployInstaller` 不会动手；
      # 它一落地就说明 `.tgz` 已经完整在服务器上了，安装器这才开始校验与替换。
      # 这一步失败会让 job 变红：包在服务器上但没人会应用它（旧进程继续服务），
      # 重新跑一次发布即可（或手工按 docs/OPERATIONS.md 的 SOP 处理）。
      - name: 上传投递标记 incoming/deploy-*.json（第二段，最后落地）
        if: env.DEPLOY_MODE != 'files'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./deploy-pkg/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          state-name: ftp-sync-state-marker.json
          dry-run: ${{ inputs.dry_run }}
          timeout: 120000
          log-level: standard
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/data/**
            **/logs/**
            **/coverage/**
            **/.env
            **/.env.*
            **/*.log
            **/test/**
            **/*.map

      # 第一段（`mode=files`）：代码与依赖清单（不含版本标记）。
      - name: 上传运行产物（逐文件模式，代码与清单）
        if: env.DEPLOY_MODE == 'files'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./dist-deploy/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          state-name: ftp-sync-state-code.json
          dry-run: ${{ inputs.dry_run }}
          timeout: 120000
          log-level: standard
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/data/**
            **/logs/**
            **/coverage/**
            **/.env
            **/.env.*
            **/*.log
            **/test/**
            **/*.map

      # 第二段（`mode=files`）：`package.json` 版本标记最后单独落地。
      - name: 上传版本标记 package.json（逐文件模式，最后落地）
        if: env.DEPLOY_MODE == 'files'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./dist-marker/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          state-name: ftp-sync-state-marker.json
          dry-run: ${{ inputs.dry_run }}
          timeout: 120000
          log-level: standard
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/data/**
            **/logs/**
            **/coverage/**
            **/.env
            **/.env.*
            **/*.log
            **/test/**
            **/*.map

      - name: 部署摘要（审计线索）
        run: |
          {
            echo "### 部署完成"
            echo ""
            echo "- 目标：\`${{ vars.FTP_SERVER_DIR }}\`"
            echo "- 来源：\`${DEPLOY_REF}\`（commit \`${GITHUB_SHA}\`）"
            echo "- 协议：\`${{ vars.FTP_PROTOCOL || 'ftps' }}\`"
            echo "- 模式：\`${DEPLOY_MODE}\`"
            if [ "$DEPLOY_MODE" = "files" ]; then
              echo "  （逐文件应急模式：代码与清单 → **版本标记 package.json 最后落地**，ADR-0057）"
            else
              echo "  顺序：\`incoming/deploy-<版本>.tgz\` → **\`incoming/deploy-<版本>.json\` 最后落地**（ADR-0065）"
              echo "  机器人扫到标记才动手：sha256 校验 → 解包 → 指纹自证 → 整目录替换 → 重启。"
            fi
            echo ""
            echo "  每轮只传 2 个文件 = **每次全量**：不再依赖 \`ftp-sync-state-*.json\`"
            echo "  记住「上次传过什么」，因此也没有「服务器被别的路径改过 → 上传被静默跳过」这种失败模式。"
            echo "  机器人自己动过 \`dist/\`（自解包 / 回滚）后会主动删掉那份旧状态。"
          } >> "$GITHUB_STEP_SUMMARY"
