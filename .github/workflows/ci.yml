name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 管理前台是独立依赖（根 pnpm install 不装），CD 会把它一起发布 ——
      # 所以前端坏了要在 CI 就拦下来，而不是等到发版时才炸。
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      # 组件测试（jsdom + @vue/test-utils）先跑：前端逻辑错误在这里就红，
      # 不用等到扫源码的契约守卫（根 `pnpm test`）猜
      - name: Test web
        run: pnpm web:test

      - name: Typecheck & build web
        run: pnpm web:build
