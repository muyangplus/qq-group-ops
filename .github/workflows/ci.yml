name: CI

# 触发面（ADR-0067，逐条说明见 docs/CD.md「CI/CD 触发策略」）：
#   · **代码 / 依赖 / 工作流 / 模板**（src、test、web、.github、package.json、.env.example 等）
#     → 本工作流跑**全量门禁**（typecheck + 全量 vitest + build + 前端三项）；
#   · **只有文档 / Markdown**（docs/**、**.md）→ 本工作流**不跑**，交给 `docs-guard.yml` 的秒级守卫
#     （隐私扫描 + 工作流审计）；一个 commit 里两者都有时两个工作流都会跑，门禁不削弱；
#   · **连续 push 只跑最后一次**：同 ref 的进行中运行会被取消（`concurrency`）——
#     本地提交阶段不再逐个 push，发版时一次推；这条是给「改错了马上补一版」兜底的。
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 管理前台是独立依赖（根 pnpm install 不装），CD 会把它一起发布 ——
      # 所以前端坏了要在 CI 就拦下来，而不是等到发版时才炸。
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      # 组件测试（jsdom + @vue/test-utils）先跑：前端逻辑错误在这里就红，
      # 不用等到扫源码的契约守卫（根 `pnpm test`）猜
      - name: Test web
        run: pnpm web:test

      - name: Typecheck & build web
        run: pnpm web:build
